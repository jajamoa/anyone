<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inconsolata, ui-monospace, monospace">
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
  <symbol id="snoo" viewBox="-16 -20 32 36">
    <line x1="0" y1="-14" x2="6" y2="-18" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="6.5" cy="-18.5" r="1.8" fill="currentColor"/>
    <circle cx="0" cy="0" r="13" fill="currentColor"/>
    <ellipse cx="-4.5" cy="-1" rx="2.2" ry="2.6" fill="#0a0a0a"/>
    <ellipse cx="4.5" cy="-1" rx="2.2" ry="2.6" fill="#0a0a0a"/>
    <path d="M-5 5 Q0 9 5 5" stroke="#0a0a0a" stroke-width="1.4" fill="none"/>
    <circle cx="-13.5" cy="0" r="2.6" fill="currentColor"/><circle cx="13.5" cy="0" r="2.6" fill="currentColor"/>
  </symbol>
  <symbol id="card" viewBox="0 0 84 30">
    <rect x="0" y="0" width="84" height="30" rx="4" fill="currentColor"/>
    <rect x="8" y="7" width="56" height="3.5" rx="1.75" fill="#fff" opacity=".55"/>
    <rect x="8" y="13.5" width="38" height="3.5" rx="1.75" fill="#fff" opacity=".4"/>
    <text x="8" y="25" font-size="6" fill="#fff" opacity=".5">&#9650; &#9660; &#9679;</text>
  </symbol>
</defs>
<rect width="1200" height="600" fill="#0a0a0a"/>
<!-- rows: avatar + comment history, each converging into the prism -->
<g stroke-width="2.6" fill="none">
  <path d="M470 118 C 600 118, 640 250, 727 293" stroke="#d2202a"/>
  <path d="M500 188 C 610 188, 650 262, 727 295" stroke="#e0641c"/>
  <path d="M446 258 C 590 258, 650 280, 727 297" stroke="#d9b300"/>
  <path d="M490 328 C 600 328, 650 312, 727 299" stroke="#2fae3a"/>
  <path d="M474 398 C 600 398, 650 330, 727 301" stroke="#1d97b3"/>
  <path d="M450 468 C 590 468, 650 345, 727 303" stroke="#8256bd"/>
</g>
<g stroke-width="2.6" stroke-linecap="round">
  <line x1="70" y1="118" x2="470" y2="118" stroke="#d2202a"/>
  <line x1="70" y1="188" x2="500" y2="188" stroke="#e0641c"/>
  <line x1="70" y1="258" x2="446" y2="258" stroke="#d9b300"/>
  <line x1="70" y1="328" x2="490" y2="328" stroke="#2fae3a"/>
  <line x1="70" y1="398" x2="474" y2="398" stroke="#1d97b3"/>
  <line x1="70" y1="468" x2="450" y2="468" stroke="#8256bd"/>
</g>
<!-- row 1 red -->
<g color="#d2202a"><use href="#snoo" x="52" y="98" width="36" height="40"/>
  <use href="#card" x="120" y="103" width="84" height="30"/><use href="#card" x="250" y="103" width="84" height="30"/><use href="#card" x="386" y="103" width="84" height="30"/></g>
<!-- row 2 orange -->
<g color="#e0641c"><use href="#snoo" x="52" y="168" width="36" height="40"/>
  <use href="#card" x="110" y="173" width="84" height="30"/><use href="#card" x="216" y="173" width="84" height="30"/><use href="#card" x="318" y="173" width="84" height="30"/><use href="#card" x="416" y="173" width="84" height="30"/></g>
<!-- row 3 yellow -->
<g color="#d9b300"><use href="#snoo" x="52" y="238" width="36" height="40"/>
  <use href="#card" x="104" y="243" width="84" height="30"/><use href="#card" x="230" y="243" width="84" height="30"/><use href="#card" x="362" y="243" width="84" height="30"/></g>
<!-- row 4 green -->
<g color="#2fae3a"><use href="#snoo" x="52" y="308" width="36" height="40"/>
  <use href="#card" x="126" y="313" width="84" height="30"/><use href="#card" x="266" y="313" width="84" height="30"/><use href="#card" x="406" y="313" width="84" height="30"/></g>
<!-- row 5 teal -->
<g color="#1d97b3"><use href="#snoo" x="52" y="378" width="36" height="40"/>
  <use href="#card" x="112" y="383" width="84" height="30"/><use href="#card" x="206" y="383" width="84" height="30"/><use href="#card" x="300" y="383" width="84" height="30"/><use href="#card" x="390" y="383" width="84" height="30"/></g>
<!-- row 6 purple -->
<g color="#8256bd"><use href="#snoo" x="52" y="448" width="36" height="40"/>
  <use href="#card" x="120" y="453" width="84" height="30"/><use href="#card" x="240" y="453" width="84" height="30"/><use href="#card" x="366" y="453" width="84" height="30"/></g>
<!-- prism -->
<polygon points="800,150 660,440 940,440" fill="#0a0a0a" stroke="#fff" stroke-width="8" opacity=".55" filter="url(#glow)"/>
<polygon points="800,150 660,440 940,440" fill="#0a0a0a" stroke="#fff" stroke-width="2.4"/>
<polygon points="727,298 868,282 868,296" fill="#fff" opacity=".85" filter="url(#soft)"/>
<!-- single white beam out -->
<line x1="868" y1="289" x2="1090" y2="289" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<g color="#f2f2f0"><use href="#snoo" x="1096" y="269" width="36" height="40"/></g>
<text x="800" y="512" text-anchor="middle" font-size="34" font-weight="800" fill="#fff" letter-spacing="2">LLM</text>
</svg>
